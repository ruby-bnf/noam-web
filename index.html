<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/noam-web/faviconIcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noam-web</title>
    <script>
      // GitHub Pages SPA — restore URL that was redirected via 404.html
      (function () {
        var search = window.location.search;
        if (search.startsWith("?p=")) {
          var decoded = decodeURIComponent(search.slice(3));
          window.history.replaceState(null, "", "/" + decoded);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
